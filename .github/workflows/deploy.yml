name: Deploy Portfolio

on:
  push:
  branches:
    - main

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: pnpm/action-setup@v4
    with:
      version: latest

  - uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: pnpm

  - run: pnpm install

  - run: PORT=8080 BASE_PATH="/" pnpm build

  - uses: actions/upload-pages-artifact@v3
    with:
      path: artifacts/portfolio/dist/public

deploy:
needs: build

permissions:
  pages: write
  id-token: write

environment:
  name: github-pages

runs-on: ubuntu-latest

steps:
  - uses: actions/deploy-pages@v4
